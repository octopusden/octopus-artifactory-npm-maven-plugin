version: '3'

services:

  artifactory:
    image: releases-docker.jfrog.io/jfrog/artifactory-oss:7.16.3
    container_name: dms-dev-artifactory
    ports:
      - 18081:8081
      - 18082:8082
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"
    ulimits:
      nproc: 65535
      nofile:
        soft: 32000
        hard: 40000